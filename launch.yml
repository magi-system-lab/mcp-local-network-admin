# launch.yml - mcp-local-network-admin
# Only what differs from the pipeline convention: app name, TZ, prod from main
# and OpenBao secrets at prod/mcp-local-network-admin.
profile: node
port: 3000
host: mcp                        # mcp.lab.home.arpa once local DNS exists
env:
  # Docker tools reach melchior's Docker over SSH instead of a mounted socket.
  # The key lives in OpenBao; melchior only accepts it from balthazar's address.
  DOCKER_SSH_HOST: 192.168.50.180
  DOCKER_SSH_USER: mcp-docker

environments:
  # No secrets: the preview only proves the image builds and the server starts.
  preview:
    env:
      DOCKER_SSH_HOST: ""
    secrets: []

  prod:
    node-port: 30500             # fixed: MCP clients are registered by address
